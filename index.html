<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#131b29" />
  <title>HIGH & LOW | Number Survival</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header><div class="brand">HIGH <span>&</span> LOW</div><div class="eyebrow">NUMBER SURVIVAL GAME</div></header>
    <section id="notice" class="notice hidden" role="alert"></section>
    <section id="entry" class="panel">
      <h1>オンライン数字当てサバイバル</h1>
      <p>名前を入力してルームを作るか、6桁コードで参加しましょう。</p>
      <label>プレイヤー名 <input id="name" maxlength="20" placeholder="プレイヤー名" autocomplete="nickname" /></label>
      <label>ルームコード <input id="code" maxlength="6" placeholder="例：A1B2C3" autocapitalize="characters" /></label>
      <div class="actions"><button id="join">ルームに参加</button><button id="create" class="secondary">新しいルームを作成</button></div>
      <p class="foot">登録不要・同じ端末の別タブでは同一参加者として扱われます。</p>
    </section>
    <section id="game" class="hidden">
      <div class="panel meta">
        <div><span class="tiny">ルーム</span><strong id="roomCode">------</strong></div>
        <div><span class="tiny">セット</span><strong id="setNo">-</strong></div>
        <div><span class="tiny">数字の範囲</span><strong id="range">-</strong></div>
        <div><span class="tiny">現在の状態</span><strong id="phase">-</strong></div>
      </div>
      <div class="cols">
        <section class="panel">
          <h2>プレイヤー</h2><div id="players"></div>
          <div id="hostPanel" class="actions hidden"><button id="hostAction">開始</button></div>
          <p id="hint" class="foot"></p>
        </section>
        <section class="panel">
          <h2 id="actionTitle">対戦</h2>
          <div id="actionContent"></div>
          <div id="actionButtons" class="actions"></div>
        </section>
      </div>
      <section class="panel"><h2>予想履歴</h2><div id="history"></div></section>
      <div class="actions"><button id="leave" class="textbutton">端末からルーム表示を終了</button></div>
    </section>
    <footer>HIGH & LOW · GitHub Pages + Supabase</footer>
  </main>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
